  <main id="main-content">
    <h2>Contact Us</h2>
    <p>Have a question about 3D printing or need help with an order? Send us a message and we'll get back to you.</p>
    
      <form action="https://formspree.io/f/your-form-id" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone">

        <p>What filament type?</p>
        <label for="filament-pla">PLA</label>
        <input type="radio" id="pla" name="filament-type" value="pla" checked>

        <label for="filament-petg">PETG</label>
        <input type="radio" id="petg" name="filament-type" value="petg">

        <label for="filament-tpu">TPU</label>
        <input type="radio" id="tpu" name="filament-type" value="tpu">

        <label for="filament-resin">Resin</label>
        <input type="radio" id="resin" name="filament-type" value="resin">

        <label for="file">Upload your 3D file:</label>
        <input type="file" id="file" name="file" accept=".stl,.obj,.3mf" required>

        <label for="message">Any questions?</label>
        <textarea id="message" name="message"></textarea>
        <button type="submit">Send Printing Request</button>
  </main>
